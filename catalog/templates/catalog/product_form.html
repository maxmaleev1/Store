{% extends 'catalog/base.html' %}
{% block title %}Создать карточку товара{% endblock %}
{% block content %}
<form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Применить</button>
    <a href="{% url 'catalog:products_list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
